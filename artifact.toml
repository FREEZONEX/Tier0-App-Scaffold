# MonoApp - UNSSWE deployment configuration
#
# This file is parsed by the Build-Deploy service to determine build, runtime,
# and health-check behavior.
# Priority: app deploy_config (DB overrides) > this file > platform hardcoded defaults.
#
# Environment injection (automatic):
#   DATABASE_URL  - injected into build_env / run_env by the backend per project schema
#   PORT          - injected by RuntimeManager from localPort

[deployment]
deploymentTarget = "autoscale"

# args semantics (temporary, until the platform lands the unified argv contract —
# see uns-swe docs/topics/artifact-args-contract.md):
#   - production build args: Build-Deploy JOINS all tokens with spaces into ONE shell
#     line. Keep the shell-token form below. NEVER rewrite it as
#     ["sh", "-c", "npm ci && npm run build"] — under space-join that executes a bare
#     `npm`, ships a source-only zip marked "build success", and the deployed app
#     crash-loops (prod incident 2026-07-17).
#   - postBuild args: Cleanup runs ONE LINE PER ELEMENT, so the whole command must be
#     a single element. Token-split form (["npm", "prune", "--omit=dev"]) executes
#     `prune` / `--omit=dev` as separate commands and the errors are silently
#     swallowed — prune never actually runs.
[deployment.postBuild]
args = ["npm prune --omit=dev"]

[[services]]
name = "web"
paths = ["/"]
localPort = 5173

[services.production]
serve = "dynamic"

[services.production.build]
args = [
  "npm", "ci", "&&",
  "npm", "run", "build",
]
outputDir = "."

[services.production.run]
args = ["node", "server.mjs"]
image = "node:22-alpine"

[services.production.run.env]
NODE_ENV = "production"
HOST = "0.0.0.0"
SESSION_SECRET = "fff03854d9eee4fca8fb13b8ef49c765494bbf984d7590d884393238ba4c59be"

[services.production.health.startup]
path = "/api/health"
timeout = 120

# Live preview (dev server running inside the Executor Pod)
[services.preview]
install = ["npm", "install"]
args = ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
port = 5173

[services.preview.env]
NODE_ENV = "development"
HOST = "0.0.0.0"
BROWSER = "none"
VITE_ALLOWED_HOSTS = "all"
SESSION_SECRET = "preview-session-secret-0123456789abcdef"
