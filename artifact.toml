# MonoApp - UNSSWE deployment configuration
#
# This file is parsed by the Build-Deploy service to determine build, runtime,
# and health-check behavior.
# Priority: app deploy_config (DB overrides) > this file > platform hardcoded defaults.
#
# Environment injection (automatic):
#   TIER0_API_HOST          - platform API gateway root for the SDK; App data lives in Tier0
#                             UNS collections the App ensures on first access (no
#                             database, migration or seed step at build or start)
#   TIER0_API_KEY           - the App's key (secret, runtime process only, never at build;
#                             Preview gets the App's preview key, deployments the deployed one).
#                             The SDK reads it; App code never does
#   TIER0_MQTT_HOST         - MQTT broker entry for the SDK on the server
#   TIER0_MQTT_PORT
#   TIER0_WORKSPACE_ID      - workspace of the App
#   TIER0_APP_ID            - agent-platform App id
#   TIER0_RUNTIME           - deployed or preview
#   PORT                    - injected by the runtime from localPort
# The front door sets the visitor (plain JSON, base64url) in X-Tier0-Visitor on
# every request, after stripping any X-Tier0-* the client sent.
#
# Health contract: GET /api/health answers 200 once the process serves requests.
# It must not touch Tier0 or any other dependency: it is called on every wake, and
# a platform outage must not stop the App from starting. It is reachable without
# a visitor and without waking anything.

[deployment]
deploymentTarget = "autoscale"

# args contract (true argv, POSIX execve semantics — see uns-swe
# docs/topics/artifact-args-contract.md):
#   Every element is passed literally to the executable; no shell word-splitting or
#   expansion. Shell semantics must be explicit: ["sh", "-c", "<script>"].
#   The platform normalizes two legacy join-era forms to ["sh", "-c", "..."]
#   with a warning: bare shell-operator tokens (e.g. "&&" as their own elements)
#   and whole commands crammed into one element (e.g. ["npm prune --omit=dev"]).
#   New files must still use the canonical argv forms shown below.

[[services]]
name = "web"
paths = ["/"]
localPort = 5173

[services.production]
serve = "dynamic"

[services.production.build]
# Keep production pruning in the build chain so a prune failure blocks artifact
# publication instead of being swallowed by non-blocking cleanup semantics.
args = ["sh", "-c", "npm ci && npm run build && npm prune --omit=dev"]
outputDir = "."
# The app layer. artifact.toml, package.json and roles.json always go with it;
# dependencies come from the separate deps layer.
include = ["dist", "server.mjs"]

# No `image`: the platform supplies each environment's default runtime image.
[services.production.run]
args = ["node", "server.mjs"]

[services.production.run.env]
NODE_ENV = "production"
HOST = "0.0.0.0"

[services.production.health.startup]
path = "/api/health"
timeout = 120

# Static bundle: the front door serves these directly, so a lazy chunk still
# loads while the App sleeps. Only content-hashed build output is listed; other
# public files go through the instance.
[static]
dir = "dist/client"
url_prefixes = ["/assets/"]

# Live preview (dev server running inside the Executor Pod)
[services.preview]
install = ["npm", "install"]
args = ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
port = 5173

[services.preview.env]
NODE_ENV = "development"
HOST = "0.0.0.0"
BROWSER = "none"
VITE_ALLOWED_HOSTS = "all"
